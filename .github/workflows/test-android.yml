name: Test Termux Runner

on:
  push:
    branches: [ "main" ]  # Tự động chạy khi bạn push code vào nhánh main
  workflow_dispatch:     # Cho phép bạn bấm nút chạy thủ công trên web

jobs:
  test-phone:
    # Bắt buộc phải điền đúng 3 nhãn hệ thống điện thoại bạn vừa báo
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Kịch bản kiểm tra thông tin điện thoại
        run: |
          echo "==== ĐANG CHẠY TRÊN ĐIỆN THOẠI ANDROID ===="
          echo "Thư mục hiện tại:" && pwd
          echo "Cấu hình chip xử lý:" && uname -a
          echo "Thời gian hệ thống:" && date
          echo "==========================================="
